<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="999" height="559" rx="14" fill="#ffffff" stroke="#cbd5e1"/>

  <text x="500" y="50" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="middle">From a pile of tasks to the next right action</text>
  <text x="500" y="80" font-size="15.5" fill="#64748b" text-anchor="middle">Three tags steer every task. The dependency graph decides what's ready — so you never pick by hand.</text>

  
    <rect x="40" y="104" width="292" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="62" y="118" width="61" height="28" rx="8" fill="#d9f2ee"/>
    <text x="92.5" y="137" font-size="16" font-weight="bold" fill="#0d9488" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">do:</text>
    <text x="135" y="137" font-size="14.5" font-weight="bold" fill="#0f172a">who acts?</text>
    <rect x="62" y="150" width="64" height="26" rx="13" fill="#d9f2ee"/>
    <text x="94" y="168" font-size="13.5" font-weight="bold" fill="#0d9488" text-anchor="middle">agent</text>
    <rect x="134" y="150" width="47.2" height="26" rx="13" fill="#fbe8d3"/>
    <text x="157.6" y="168" font-size="13.5" font-weight="bold" fill="#c2701c" text-anchor="middle">you</text>
  
    <rect x="354" y="104" width="292" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="376" y="118" width="83" height="28" rx="8" fill="#d9f2ee"/>
    <text x="417.5" y="137" font-size="16" font-weight="bold" fill="#0d9488" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">type:</text>
    <text x="471" y="137" font-size="14.5" font-weight="bold" fill="#0f172a">what kind?</text>
    <rect x="376" y="150" width="64" height="26" rx="13" fill="#f1f5f9"/>
    <text x="408" y="168" font-size="13.5" font-weight="bold" fill="#64748b" text-anchor="middle">build</text>
    <rect x="448" y="150" width="89.2" height="26" rx="13" fill="#f1f5f9"/>
    <text x="492.6" y="168" font-size="13.5" font-weight="bold" fill="#64748b" text-anchor="middle">research</text>
    <rect x="545.2" y="150" width="72.4" height="26" rx="13" fill="#f1f5f9"/>
    <text x="581.4000000000001" y="168" font-size="13.5" font-weight="bold" fill="#64748b" text-anchor="middle">review</text>
  
    <rect x="668" y="104" width="292" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="690" y="118" width="105" height="28" rx="8" fill="#d9f2ee"/>
    <text x="742.5" y="137" font-size="16" font-weight="bold" fill="#0d9488" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">effort:</text>
    <text x="807" y="137" font-size="14.5" font-weight="bold" fill="#0f172a">how big?</text>
    <rect x="690" y="150" width="30.4" height="26" rx="13" fill="#f1f5f9"/>
    <text x="705.2" y="168" font-size="13.5" font-weight="bold" fill="#64748b" text-anchor="middle">S</text>
    <rect x="728.4" y="150" width="30.4" height="26" rx="13" fill="#f1f5f9"/>
    <text x="743.6" y="168" font-size="13.5" font-weight="bold" fill="#64748b" text-anchor="middle">M</text>
    <rect x="766.8" y="150" width="30.4" height="26" rx="13" fill="#f1f5f9"/>
    <text x="782" y="168" font-size="13.5" font-weight="bold" fill="#64748b" text-anchor="middle">L</text>

  
    <rect x="40" y="286" width="150" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="115" y="326" font-size="16.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Capture</text>
    <text x="115" y="349" font-size="12.5" fill="#64748b" text-anchor="middle">dump every task in</text>
  
    <rect x="228" y="286" width="150" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="303" y="326" font-size="16.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Tag</text>
    <text x="303" y="349" font-size="12.5" fill="#64748b" text-anchor="middle">do · type · effort</text>
  
    <rect x="416" y="286" width="150" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="491" y="326" font-size="16.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Link deps</text>
    <text x="491" y="349" font-size="12.5" fill="#64748b" text-anchor="middle">what blocks what</text>
  
    <rect x="604" y="286" width="150" height="92" rx="12" fill="#0d9488" stroke="#0d9488" stroke-width="2"/>
    <text x="679" y="326" font-size="16.5" font-weight="bold" fill="#ffffff" text-anchor="middle">bd ready</text>
    <text x="679" y="349" font-size="12.5" fill="#d9f2ee" text-anchor="middle">unblocked frontier</text>
  
    <rect x="792" y="286" width="150" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="867" y="326" font-size="16.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Do it</text>
    <text x="867" y="349" font-size="12.5" fill="#64748b" text-anchor="middle">agent, or you</text>

  <path d="M190 332 H220 m-9 -6 l9 6 l-9 6" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M378 332 H408 m-9 -6 l9 6 l-9 6" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M566 332 H596 m-9 -6 l9 6 l-9 6" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M754 332 H784 m-9 -6 l9 6 l-9 6" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- close → frontier recomputes: loop from "Do it" back up to "bd ready" -->
  <path d="M867 378 V470 H679 V386 m-6 9 l6 -9 l6 9" fill="none" stroke="#0d9488" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="773" y="463" font-size="13.5" font-weight="bold" fill="#0d9488" text-anchor="middle">close it → the frontier recomputes</text>

  <text x="500" y="520" font-size="14" fill="#64748b" text-anchor="middle">The agent grabs <tspan fill="#0d9488" font-weight="bold">do:agent</tspan> work that's ready; you take <tspan fill="#c2701c" font-weight="bold">do:human</tspan>. Mark one done and the next right thing surfaces on its own.</text>
</svg>
