<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#F4F1EA" />
<title>ATS · Operator</title>
<!-- API base: empty = same origin (local dev). On CF Pages, set to the backend URL. -->
<meta name="operator-api" content="" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #F4F1EA; --paper: #FBFAF6; --ink: #20201C; --muted: #6B675C;
    --line: #E4DFD2; --teal: #137A63; --teal-soft: #E2F0EB; --red: #C0492F; --red-soft: #F6E5E0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--cream); color: var(--ink);
    font-family: Inter, system-ui, sans-serif;
    display: flex; justify-content: center;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  #app { width: 100%; max-width: 460px; min-height: 100dvh; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px 8px; }
  .brand { font-family: Fraunces, serif; font-weight: 600; font-size: 19px; letter-spacing: -.01em; }
  .brand b { color: var(--teal); }
  .count { font: 500 12px/1 "JetBrains Mono", monospace; color: var(--muted); background: var(--paper); border: 1px solid var(--line); padding: 6px 9px; border-radius: 999px; }
  .deck { position: relative; flex: 1; margin: 8px 18px 0; }
  .card {
    position: absolute; inset: 0; background: var(--paper); border: 1px solid var(--line);
    border-radius: 22px; box-shadow: 0 18px 40px -22px rgba(40,36,28,.45); padding: 24px 22px;
    display: flex; flex-direction: column; cursor: grab; user-select: none; touch-action: pan-y;
  }
  .badge { align-self: flex-start; font: 600 11px/1 Inter; letter-spacing: .08em; text-transform: uppercase;
    color: var(--teal); background: var(--teal-soft); padding: 7px 11px; border-radius: 999px; }
  .badge.archive { color: #9A6A1E; background: #F3E9D6; }
  .title { font-family: Fraunces, serif; font-weight: 600; font-size: 25px; line-height: 1.18; letter-spacing: -.01em; margin: 18px 0 10px; }
  .subtitle { color: var(--muted); font-size: 15px; line-height: 1.45; }
  .fliphint { margin-top: auto; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .back-head { font: 600 11px/1 Inter; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .back-body { font-size: 15.5px; line-height: 1.55; color: var(--ink); }
  .stamp { position: absolute; top: 22px; font: 700 22px/1 Inter; letter-spacing: .06em; padding: 8px 12px; border-radius: 10px; border: 2.5px solid; }
  .stamp.yes { left: 22px; color: var(--teal); border-color: var(--teal); transform: rotate(-12deg); }
  .stamp.no { right: 22px; color: var(--red); border-color: var(--red); transform: rotate(12deg); }
  .controls { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 22px 0 26px; }
  .btn { width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper);
    display: grid; place-items: center; cursor: pointer; box-shadow: 0 8px 18px -12px rgba(40,36,28,.5); transition: transform .12s; }
  .btn:active { transform: scale(.92); }
  .btn.no { color: var(--red); } .btn.yes { color: var(--teal); width: 68px; height: 68px; }
  .btn.flip { width: 50px; height: 50px; color: var(--muted); }
  .btn svg { width: 26px; height: 26px; } .btn.yes svg { width: 30px; height: 30px; }
  .empty { flex: 1; display: grid; place-content: center; text-align: center; gap: 10px; color: var(--muted); padding: 40px; }
  .empty .big { font-family: Fraunces, serif; font-size: 26px; color: var(--ink); }
  .toast { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--cream);
    font-size: 13.5px; padding: 9px 14px; border-radius: 999px; box-shadow: 0 10px 24px -10px rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import React, { useState, useEffect, useCallback } from 'https://esm.sh/react@18.3.1';
import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
import { motion, AnimatePresence, useMotionValue, useTransform } from 'https://esm.sh/framer-motion@11.3.19?deps=react@18.3.1,react-dom@18.3.1';
import htm from 'https://esm.sh/htm@3.1.1';
const html = htm.bind(React.createElement);
const M = motion;

const API = (document.querySelector('meta[name="operator-api"]')?.content || '').replace(/\/$/, '');
const THRESHOLD = 110;
const buzz = (ms) => { try { navigator.vibrate?.(ms); } catch {} };

const Icon = ({ d, ...p }) => html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" ...${p}><path d=${d} /></svg>`;
const X = (p) => html`<${Icon} d="M6 6l12 12M18 6L6 18" ...${p} />`;
const Check = (p) => html`<${Icon} d="M5 13l4 4L19 7" ...${p} />`;
const Info = (p) => html`<${Icon} d="M12 11v6M12 7h.01M12 21a9 9 0 100-18 9 9 0 000 18z" ...${p} />`;

function Card({ card, top, onDecide }) {
  const x = useMotionValue(0);
  const rotate = useTransform(x, [-260, 260], [-16, 16]);
  const yesOp = useTransform(x, [20, 130], [0, 1]);
  const noOp = useTransform(x, [-130, -20], [1, 0]);
  const [flipped, setFlipped] = useState(false);

  const end = (_e, info) => {
    if (info.offset.x > THRESHOLD) { buzz(18); onDecide(card, 'approve', 1); }
    else if (info.offset.x < -THRESHOLD) { buzz(18); onDecide(card, 'reject', -1); }
  };

  return html`
    <${M.div} class="card"
      style=${{ x, rotate, zIndex: top ? 2 : 1, scale: top ? 1 : 0.955, y: top ? 0 : 14, pointerEvents: top ? 'auto' : 'none' }}
      drag=${top ? 'x' : false} dragSnapToOrigin dragElastic=${0.5} onDragEnd=${end}
      onTap=${() => top && setFlipped((f) => !f)}
      initial=${{ scale: 0.955, y: 14, opacity: 0.0 }} animate=${{ opacity: 1 }}
      exit=${{ x: (card.__dir || 1) * 460, opacity: 0, transition: { duration: 0.28 } }}>
      <${M.div} class=${'stamp yes'} style=${{ opacity: yesOp }}>APPROVE<//>
      <${M.div} class=${'stamp no'} style=${{ opacity: noOp }}>REJECT<//>
      ${flipped
        ? html`<div style=${{ display: 'flex', flexDirection: 'column', height: '100%' }}>
            <div class="back-head">${card.back.heading}</div>
            <div class="back-body">${card.back.body}</div>
            <div class="fliphint" style=${{ marginTop: 'auto' }}><${Info} style=${{ width: 15, height: 15 }} /> tap to flip back</div>
          </div>`
        : html`<${React.Fragment}>
            <span class=${'badge ' + card.kind}>${card.front.badge}</span>
            <div class="title">${card.front.title}</div>
            <div class="subtitle">${card.front.subtitle}</div>
            <div class="fliphint"><${Info} style=${{ width: 15, height: 15 }} /> tap for context · swipe to decide</div>
          </${React.Fragment}>`}
    </${M.div}>`;
}

function App() {
  const [cards, setCards] = useState(null);
  const [corpus, setCorpus] = useState(null);
  const [toast, setToast] = useState(null);
  const [err, setErr] = useState(null);

  useEffect(() => {
    fetch(`${API}/api/suggestions`).then((r) => r.json()).then((d) => {
      setCards(d.suggestions || []); setCorpus(d.corpus || null);
    }).catch((e) => setErr(String(e)));
  }, []);

  const flash = (m) => { setToast(m); setTimeout(() => setToast(null), 1600); };

  const decide = useCallback((card, action, dir) => {
    card.__dir = dir;
    setCards((cur) => cur.filter((c) => c.id !== card.id));
    fetch(`${API}/api/suggestions/${encodeURIComponent(card.id)}/${action}`, { method: 'POST' })
      .then((r) => r.json())
      .then((res) => flash(action === 'approve' ? (res.summary || 'Approved') : 'Dismissed'))
      .catch(() => flash('Saved offline'));
  }, []);

  if (err) return html`<div class="empty"><div class="big">Backend unreachable</div><div>${err}</div></div>`;
  if (!cards) return html`<div class="empty"><div>Loading suggestions…</div></div>`;

  const top = cards[0];
  const next = cards[1];

  return html`<${React.Fragment}>
    <div class="topbar">
      <div class="brand">ats <b>·</b> operator</div>
      <div class="count">${cards.length} pending</div>
    </div>
    ${cards.length === 0
      ? html`<div class="empty"><div class="big">All caught up</div><div>No suggestions right now${corpus ? ` · ${corpus.active} active tasks scanned` : ''}.</div></div>`
      : html`<div class="deck">
          <${AnimatePresence}>
            ${next ? html`<${Card} key=${next.id} card=${next} top=${false} onDecide=${decide} />` : null}
            <${Card} key=${top.id} card=${top} top=${true} onDecide=${decide} />
          </${AnimatePresence}>
        </div>`}
    ${cards.length > 0 ? html`<div class="controls">
        <button class="btn no" onClick=${() => { buzz(18); decide(top, 'reject', -1); }} aria-label="Reject"><${X} /></button>
        <button class="btn yes" onClick=${() => { buzz(18); decide(top, 'approve', 1); }} aria-label="Approve"><${Check} /></button>
      </div>` : null}
    ${toast ? html`<div class="toast">${toast}</div>` : null}
  </${React.Fragment}>`;
}

createRoot(document.getElementById('app')).render(html`<${App} />`);
</script>
</body>
</html>
