name: Release

# Tag-driven release: pushing a vX.Y.Z tag publishes every public workspace
# package at that version to npm with provenance and creates the GitHub release
# with generated notes. All packages share one version (npm run check:release).
# npm trusts this workflow (trusted publishing): the job proves itself with its
# OIDC token, so no npm token is stored. npm does that exchange from 11.5.1 on.
on:
  push:
    tags:
      - 'v*'
  # Proof only, no publish: npm trusts this workflow file whatever its trigger, so a manual run here exchanges
  # the job's OIDC token per package and says which package npm would refuse (.github/scripts/npm-trust-proof.mjs).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-trust-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # the OIDC token npm exchanges; nothing is published
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Exchange the OIDC token with npm for every public package
        run: node .github/scripts/npm-trust-proof.mjs --out npm-trust-proof.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: npm-trust-proof
          path: npm-trust-proof.json

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # npm provenance (--provenance)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check:release
      - run: npm run check:publish

      - name: npm 11 for trusted publishing
        run: npm install -g npm@11.12.1

      - name: Verify tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != package.json ${PKG}" >&2
            exit 1
          fi

      - name: npm publish of each version npm lacks; one npm already serves with the same contents is skipped
        id: already-published
        env:
          NPM_CONFIG_PROVENANCE: true
        run: node .github/scripts/npm-publish-new.mjs --dir . --out already-published.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
